# E8: chi phí giao tiếp theo độ phức tạp model (REQ-15, REQ-16, H8; ADR-010, ADR-011), thẻ
# docs/experiments/E8.md. 72 lượt.
# {M0 logreg, M1 smallcnn, M2 mlp2nn, M3 cnn_mcmahan} × {T1 ring, T3 gossip, T4 FC} × {IID, α = 0.1}
# × seed {0, 1, 2}; N = 8, DFedAvg τ = 20, R = 50 (τ·R = 1,000, docs/PERF.md §4), η chung 0.1, không chọn lại
# cho từng model. Process runtime: mỗi node một tiến trình qua gloo, deploy local (Docker để sau, T22c).
# Chạy với --workers 1: mỗi lượt đã dùng 9 tiến trình.
experiment: e8_model_complexity
profile: ../profiles/full.yaml
blocks:
  - seeds: [0, 1, 2]
    set:
      num_nodes: 8
      local_steps: 1000
      runtime: processes
      deploy: local
      algorithm: {lr: 0.1}
    grid:
      model: [logreg, smallcnn, mlp2nn, cnn_mcmahan]
      topology: [{kind: ring}, {kind: gossip}, {kind: fully_connected}]
      partition: [{scheme: iid}, {scheme: dirichlet, alpha: 0.1}]
