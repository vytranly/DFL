# E1: ảnh hưởng Non-IID (RQ1, H1; SAN-4), thẻ docs/experiments/E1.md. 70 lượt.
# DFedAvg (τ = 20, μ = 0), η chung 0.1 (ADR-007), N = 20, MH, profile full.
# {T1 ring, T4 FC} × {α = 100, 1, 0.5, 0.1, 0.05, #C = 2, #C = 1} × seed {0…4}; ô IID lấy từ E0b.
# Chạy các ô α = 100 trước (--only partition.alpha=100.0) để kiểm SAN-4 sớm (SPEC §9.3).
experiment: e1_noniid
profile: ../profiles/full.yaml
blocks:
  - seeds: [0, 1, 2, 3, 4]
    set: {algorithm: {lr: 0.1}}
    grid:
      topology: [{kind: ring}, {kind: fully_connected}]
      partition:
        - {scheme: dirichlet, alpha: 100.0}
        - {scheme: dirichlet, alpha: 1.0}
        - {scheme: dirichlet, alpha: 0.5}
        - {scheme: dirichlet, alpha: 0.1}
        - {scheme: dirichlet, alpha: 0.05}
        - {scheme: label_k, k: 2}
        - {scheme: label_k, k: 1}
