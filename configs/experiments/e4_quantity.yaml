# E4: quantity skew và trọng số trộn (RQ4, H6), thẻ docs/experiments/E4.md. 15 lượt, seed {0, 1, 2}.
# β = 0.5: T2 × {uniform, size-corrected} và T4 × size-weighted (đường server, B3) (9);
# α = 0.1: T2 × {uniform, size-corrected} (6). Ô MH lấy từ E4a, E1, E2; ô size-weighted ở α = 0.1 lấy từ E1c.
# DFedAvg τ = 20, η chung 0.1.
experiment: e4_quantity
profile: ../profiles/full.yaml
blocks:
  - seeds: [0, 1, 2]
    set: {topology: {kind: erdos_renyi}, algorithm: {lr: 0.1}}
    grid:
      mixing: [uniform, size_corrected]
      partition: [{scheme: quantity, beta: 0.5}, {scheme: dirichlet, alpha: 0.1}]
  - seeds: [0, 1, 2]
    set:
      topology: {kind: server}
      mixing: size_weighted
      partition: {scheme: quantity, beta: 0.5}
      algorithm: {lr: 0.1}
