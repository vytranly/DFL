[build-system]
requires = ["setuptools>=80"]
build-backend = "setuptools.build_meta"

[project]
name = "dfl"
version = "0.1.0"
description = "Mô phỏng Decentralized Federated Learning để đo ảnh hưởng của dữ liệu Non-IID (Đề 2 — ĐATH HK261)"
readme = "README.md"
requires-python = ">=3.12,<3.13"
# Ghim theo docs/KE_HOACH_DE_TAI_2.md §4.8. torch/torchvision nên cài bản CPU trước
# (xem README) để pip không kéo bản CUDA nặng vài GB từ PyPI.
dependencies = [
    "torch==2.14.0",
    "torchvision==0.29.0",
    "networkx==3.7",
    "numpy==2.5.3",
    "pandas==3.0.6",
    "matplotlib==3.11.2",
    "pyyaml==6.0.3",
]

[project.optional-dependencies]
dev = [
    "import-linter==2.15",
    "pytest==9.1.1",
    "pytest-cov==7.1.0",
    "ruff==0.16.9",
    "scikit-learn==1.9.1",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 110
target-version = "py312"
# docs/spikes chứa script khảo sát (không phải code sản phẩm) và là bản gốc của hàm tham chiếu cho test golden.
extend-exclude = ["docs"]

[tool.ruff.lint]
# E, F, W, I, B, UP là bộ luật gốc. Các luật sau giữ "sàn" của CONSTRAINTS.md bằng luật có sẵn của ruff.
select = [
    "E", "F", "W", "I", "B", "UP",
    "PGH", "RUF100",   # F3: noqa / type: ignore phải ghi mã luật cụ thể; không để noqa thừa
    "FIX", "ERA",      # F4: không TODO / FIXME / XXX / HACK; không code bị comment-out
    "S110", "S112",    # F4: không nuốt lỗi bằng except rỗng
    "S301", "S506",    # F6: không unpickle dữ liệu ngoài; chỉ yaml.safe_load
    "NPY002", "S311",  # F7: không dùng RNG toàn cục (numpy.random kiểu cũ, module random)
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
# Để test import được analysis/, vốn nằm ngoài src/.
pythonpath = ["."]

[tool.coverage.run]
source = ["src/dfl", "analysis"]
omit = ["src/dfl/cli.py"]

[tool.coverage.report]
# CONSTRAINTS.md, "Ngưỡng có số": coverage dòng ≥ 80% cho src/dfl và analysis/.
fail_under = 80

# Ranh giới import theo capability map (SPEC §3.2), kiểm bằng `lint-imports` (CONSTRAINTS.md).
[tool.importlinter]
root_packages = ["dfl", "analysis"]
include_external_packages = true
# Import dưới `if TYPE_CHECKING:` không chạy lúc runtime nên không tính (contracts.py chỉ import torch ở đó).
exclude_type_checking_imports = true

[[tool.importlinter.contracts]]
id = "layers"
name = "Hướng phụ thuộc một chiều của capability map (SPEC §3.2)"
type = "layers"
# "|": các module cùng tầng không được import lẫn nhau; ":": được import lẫn nhau; "(...)": tầng tùy chọn.
layers = [
    "dfl.sim : (dfl.cli) : (dfl.__main__)",
    "dfl.data | dfl.network | dfl.learning | dfl.metrics | dfl.io",
    "dfl.contracts : (dfl.config) : (dfl.seeding)",
]

[[tool.importlinter.contracts]]
id = "no-analysis-in-src"
name = "src/dfl không bao giờ import analysis (SPEC §3.2)"
type = "forbidden"
source_modules = ["dfl"]
forbidden_modules = ["analysis"]

[[tool.importlinter.contracts]]
id = "analysis-reads-only"
name = "analysis chỉ được import dfl.io và dfl.contracts (SPEC §3.2)"
type = "forbidden"
source_modules = ["analysis"]
forbidden_modules = [
    "dfl.sim", "dfl.cli", "dfl.__main__", "dfl.data", "dfl.network",
    "dfl.learning", "dfl.metrics", "dfl.config", "dfl.seeding",
]

[[tool.importlinter.contracts]]
id = "pure-no-torch"
name = "Module thuần không nạp torch, kể cả gián tiếp (SPEC §3.2, ENG-6)"
type = "forbidden"
# T04 thêm "dfl.data.partition", "dfl.data.heterogeneity" khi hai file đó tồn tại
# (import-linter báo lỗi nếu source_modules có module chưa tồn tại).
source_modules = ["dfl.contracts", "dfl.network"]
forbidden_modules = ["torch", "torchvision"]
